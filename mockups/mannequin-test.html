<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Mannequin.js Test — ComfyBlockout Mockup</title>
	<style>
		:root { color-scheme: dark; }
		html, body { margin: 0; padding: 0; height: 100%; background: #14141c; color: #ddd; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
		/* mannequin.js hardcodes canvas as position:fixed / 100% — we let it own
		   the full viewport and float our UI panels on top. */
		.panel {
			position: fixed; top: 12px;
			background: rgba(30, 30, 40, 0.85); backdrop-filter: blur(8px);
			border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
			padding: 12px; z-index: 10;
			max-height: calc(100vh - 24px); overflow-y: auto;
		}
		.panel.left  { left: 12px;  width: 190px; }
		.panel.right { right: 12px; width: 220px; }
		.kicker { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin: 0 0 8px; }
		.pose-btn {
			display: block; width: 100%; padding: 7px 9px; margin: 0 0 3px;
			background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
			border-radius: 5px; color: rgba(255,255,255,0.85); cursor: pointer;
			font: inherit; font-size: 11px; text-align: left;
			transition: background 0.12s, border-color 0.12s;
		}
		.pose-btn:hover { background: rgba(255,180,84,0.14); border-color: rgba(255,180,84,0.4); color: #ffd28a; }
		.pose-btn.active { background: rgba(255,180,84,0.22); color: #ffd28a; border-color: rgba(255,180,84,0.55); }
		.slider-row { display: flex; flex-direction: column; margin-bottom: 8px; }
		.slider-row label { font-size: 10px; color: rgba(255,255,255,0.55); display: flex; justify-content: space-between; margin-bottom: 3px; letter-spacing: 0.03em; }
		.slider-row label span { color: rgba(255,180,84,0.85); font-family: ui-monospace, monospace; }
		.slider-row input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
		.slider-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #ffb454; border-radius: 50%; cursor: pointer; }
		.divider { height: 1px; background: rgba(255,255,255,0.06); margin: 10px 0; }
		#status {
			position: fixed; bottom: 12px; left: 12px; z-index: 10;
			font-size: 10px; color: rgba(255,255,255,0.5); pointer-events: none;
			background: rgba(30,30,40,0.7); padding: 5px 10px; border-radius: 4px;
			backdrop-filter: blur(6px);
		}
		.pill {
			display: inline-block; padding: 2px 6px; border-radius: 3px;
			background: rgba(255,180,84,0.18); color: #ffd28a;
			font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
		}
		#print-btn {
			margin-top: 6px; width: 100%; padding: 7px 10px;
			background: rgba(255,180,84,0.22); border: 1px solid rgba(255,180,84,0.4);
			color: #ffd28a; border-radius: 5px; cursor: pointer; font: inherit; font-size: 11px;
		}
		#print-btn:hover { background: rgba(255,180,84,0.32); }
		/* Mannequin.js's canvas needs to sit BEHIND our panels. It sets its own
		   inline style with position:fixed / z-index unset, so browser default
		   stacking puts it at 0 — panels above with z-index:10 sit on top. */
	</style>
</head>
<body>
<aside class="panel left">
	<h3 class="kicker">Pose Presets</h3>
	<button class="pose-btn active" data-pose="tpose">T-Pose</button>
	<button class="pose-btn" data-pose="standing">Standing</button>
	<button class="pose-btn" data-pose="sitting">Sitting</button>
	<button class="pose-btn" data-pose="wave">Waving</button>
	<button class="pose-btn" data-pose="walk">Walking</button>
	<button class="pose-btn" data-pose="crouch">Crouching</button>
	<button class="pose-btn" data-pose="action">Action</button>
	<div class="divider"></div>
	<h3 class="kicker">Kind</h3>
	<button class="pose-btn kind-btn active" data-kind="Male">Male</button>
	<button class="pose-btn kind-btn" data-kind="Female">Female</button>
	<button class="pose-btn kind-btn" data-kind="Child">Child</button>
</aside>

<aside class="panel right">
	<h3 class="kicker">Joint Sliders</h3>
	<div class="slider-row">
		<label>Head Turn <span data-val="head_turn">0</span></label>
		<input type="range" min="-90" max="90" value="0" data-joint="head_turn">
	</div>
	<div class="slider-row">
		<label>Head Tilt <span data-val="head_tilt">0</span></label>
		<input type="range" min="-45" max="45" value="0" data-joint="head_tilt">
	</div>
	<div class="slider-row">
		<label>Torso Bend <span data-val="torso_bend">0</span></label>
		<input type="range" min="-30" max="60" value="0" data-joint="torso_bend">
	</div>
	<div class="slider-row">
		<label>L Arm Raise <span data-val="l_arm_raise">0</span></label>
		<input type="range" min="-45" max="180" value="0" data-joint="l_arm_raise">
	</div>
	<div class="slider-row">
		<label>R Arm Raise <span data-val="r_arm_raise">0</span></label>
		<input type="range" min="-45" max="180" value="0" data-joint="r_arm_raise">
	</div>
	<div class="slider-row">
		<label>L Elbow Bend <span data-val="l_elbow">0</span></label>
		<input type="range" min="0" max="150" value="0" data-joint="l_elbow">
	</div>
	<div class="slider-row">
		<label>R Elbow Bend <span data-val="r_elbow">0</span></label>
		<input type="range" min="0" max="150" value="0" data-joint="r_elbow">
	</div>
	<div class="slider-row">
		<label>L Knee Bend <span data-val="l_knee">0</span></label>
		<input type="range" min="0" max="140" value="0" data-joint="l_knee">
	</div>
	<div class="slider-row">
		<label>R Knee Bend <span data-val="r_knee">0</span></label>
		<input type="range" min="0" max="140" value="0" data-joint="r_knee">
	</div>
	<button id="print-btn" type="button">Copy posture JSON</button>
</aside>

<div id="status">mannequin.js · <span class="pill">v5</span> · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
	"imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
		"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
		"mannequin":  "https://cdn.jsdelivr.net/gh/boytchev/mannequin.js/src/mannequin.js",
		"mannequin/": "https://cdn.jsdelivr.net/gh/boytchev/mannequin.js/src/"
	}
}
</script>

<script type="module">
// Surface any error as a bright red banner in the corner so we don't have to
// hunt through DevTools for it. Global error listeners catch both sync throws
// and unhandled promise rejections during dynamic import.
function showErr(msg) {
	let el = document.getElementById("err-banner");
	if (!el) {
		el = document.createElement("div");
		el.id = "err-banner";
		el.style.cssText = "position:fixed;bottom:44px;left:12px;right:12px;padding:10px 14px;background:rgba(180,40,40,0.92);color:#fff;font-family:ui-monospace,monospace;font-size:11px;border-radius:6px;z-index:100;white-space:pre-wrap;max-width:900px;cursor:pointer";
		el.title = "Click to dismiss";
		el.addEventListener("click", () => el.remove());
		document.body.appendChild(el);
	}
	el.textContent = "ERROR: " + msg + "\n(click to dismiss)";
	console.error("[mannequin-test]", msg);
}
function clearErr() {
	document.getElementById("err-banner")?.remove();
}
window.addEventListener("error", e => showErr(e.message + "  @ " + (e.filename || "?") + ":" + (e.lineno || "?")));
window.addEventListener("unhandledrejection", e => showErr("unhandled: " + (e.reason?.message || e.reason || "?")));

// Import creates the stage-side effect: the library's initStage() runs at
// module load, auto-appending a full-page WebGLRenderer canvas to <body>.
// Both the bare `mannequin` key AND the `mannequin/` folder alias are needed
// in the importmap above — the library's internal files import from relative
// paths under `mannequin/` (like `../globals.js`) so both entries must resolve.
const mod = await import("mannequin").catch(err => { showErr("import failed: " + err.message); throw err; });
const { Male, Female, Child, createStage } = mod;
// scene/camera/renderer/controls live on scene.js — mannequin.js's main file
// only re-exports createStage + getStage from there, so we have to pull the
// state objects from the folder alias directly.
const sceneMod = await import("mannequin/scene.js").catch(err => { showErr("scene.js import failed: " + err.message); throw err; });
const { scene, camera, renderer, controls } = sceneMod;
const THREE = (await import("three"));
console.log("[mannequin-test] imported:", Object.keys(mod));

// Sanity-check that createStage exists before calling.
if (typeof createStage !== "function") {
	showErr("createStage missing from mannequin exports. Got: " + Object.keys(mod).join(", "));
	throw new Error("no createStage");
}

createStage();

// Verify the canvas actually landed in the DOM after createStage runs.
requestAnimationFrame(() => {
	const cvs = document.querySelector("canvas");
	if (!cvs) {
		showErr("createStage did not append a canvas to the document. Check for import errors above.");
	} else {
		console.log("[mannequin-test] canvas:", cvs.width, "×", cvs.height, "at z-index", getComputedStyle(cvs).zIndex);
		// If we got here with a canvas, whatever error banner may still be
		// hanging around is stale — clear it. New errors from later in the
		// script (drag setup, etc.) will re-show it.
		clearErr();
	}
});

let currentKind = "Male";
const kinds = { Male, Female, Child };
let man = new kinds[currentKind]();

// ── Simplified appearance ────────────────────────────────────────
// mannequin.js ships with per-body-part tinting (torso, joints, skin, hair
// all get slightly different colors). For a blockout scale-reference figure,
// a uniform matte gray reads cleaner. Walk every descendant mesh and force
// a single material color — preserves the geometry + shadow response but
// unifies the look.
const BODY_COLOR = 0xc4c4c4;  // light warm gray
const HIGHLIGHT_COLOR = 0xffb454;  // amber, matches app palette
function applyUniformMaterial(root, colorHex) {
	root.traverse(o => {
		if (o.isMesh && o.material) {
			if (Array.isArray(o.material)) o.material.forEach(m => m.color?.setHex(colorHex));
			else o.material.color?.setHex(colorHex);
		}
	});
}
applyUniformMaterial(man, BODY_COLOR);

// ── Pose presets ─────────────────────────────────────────────────
// mannequin.js exposes joint rotations in DEGREES via property setters —
// `man.head.turn = 30`, `man.l_elbow.bend = 90`, etc. Each preset below is a
// flat "part.prop" → degrees map; applyPreset walks it and writes each one.
const PRESETS = {
	tpose: {}, // default constructor state
	standing: {
		"l_arm.raise": -70, "r_arm.raise": -70,
		"l_arm.straddle": 8, "r_arm.straddle": 8,
	},
	sitting: {
		"l_leg.raise": 90,  "r_leg.raise": 90,
		"l_knee.bend": 100, "r_knee.bend": 100,
		"l_arm.raise": -50, "r_arm.raise": -50,
		"l_elbow.bend": 30, "r_elbow.bend": 30,
	},
	wave: {
		"l_arm.raise": -80, "l_arm.straddle": 10,
		"r_arm.raise": 30,  "r_arm.straddle": 60,
		"r_elbow.bend": 40, "head.turn": -15,
	},
	walk: {
		"l_leg.raise": 25, "r_leg.raise": -20,
		"l_knee.bend": 15, "r_knee.bend": 30,
		"l_arm.raise": -55, "r_arm.raise": -75,
		"l_arm.straddle": 10, "r_arm.straddle": 8,
	},
	crouch: {
		"l_leg.raise": 90, "r_leg.raise": 90,
		"l_knee.bend": 130, "r_knee.bend": 130,
		"torso.bend": 40,
		"l_arm.raise": -30, "r_arm.raise": -30,
		"l_elbow.bend": 40, "r_elbow.bend": 40,
	},
	action: {
		"torso.turn": 30, "torso.bend": 20,
		"r_arm.raise": 90, "r_arm.straddle": 30,
		"r_elbow.bend": 60,
		"l_arm.raise": -70, "l_arm.straddle": 15,
		"l_leg.raise": 20, "l_knee.bend": 20,
		"r_leg.raise": -15,
	},
};

const JOINT_NAMES = ["head", "neck", "torso", "l_arm", "r_arm", "l_elbow", "r_elbow",
                     "l_wrist", "r_wrist", "l_leg", "r_leg", "l_knee", "r_knee",
                     "l_ankle", "r_ankle"];

function resetPose(m) {
	for (const p of JOINT_NAMES) {
		const j = m[p]; if (!j) continue;
		for (const f of ["raise", "turn", "tilt", "bend", "straddle", "nod"]) {
			try { j[f] = 0; } catch {}
		}
	}
}

function applyPreset(m, name) {
	resetPose(m);
	const preset = PRESETS[name] || {};
	for (const [path, val] of Object.entries(preset)) {
		const [part, prop] = path.split(".");
		const j = m[part]; if (!j) continue;
		try { j[prop] = val; } catch (e) { console.warn("preset skip", path, e); }
	}
}

// ── UI wiring ─────────────────────────────────────────────────────
document.querySelectorAll(".pose-btn[data-pose]").forEach(btn => {
	btn.addEventListener("click", () => {
		document.querySelectorAll(".pose-btn[data-pose]").forEach(b => b.classList.remove("active"));
		btn.classList.add("active");
		applyPreset(man, btn.dataset.pose);
		syncSlidersFromMannequin();
	});
});

document.querySelectorAll(".kind-btn").forEach(btn => {
	btn.addEventListener("click", () => {
		document.querySelectorAll(".kind-btn").forEach(b => b.classList.remove("active"));
		btn.classList.add("active");
		const nextKind = btn.dataset.kind;
		if (nextKind === currentKind) return;
		// mannequin.js auto-adds instances to the internal scene at construction
		// time, so we have to manually remove the previous one from that scene
		// before spawning the replacement.
		scene.remove(man);
		currentKind = nextKind;
		man = new kinds[currentKind]();
		applyUniformMaterial(man, BODY_COLOR);
		const active = document.querySelector(".pose-btn[data-pose].active");
		if (active) applyPreset(man, active.dataset.pose);
		syncSlidersFromMannequin();
	});
});

const SLIDER_MAP = {
	head_turn:   ["head",   "turn"],
	head_tilt:   ["head",   "tilt"],
	torso_bend:  ["torso",  "bend"],
	l_arm_raise: ["l_arm",  "raise"],
	r_arm_raise: ["r_arm",  "raise"],
	l_elbow:     ["l_elbow","bend"],
	r_elbow:     ["r_elbow","bend"],
	l_knee:      ["l_knee", "bend"],
	r_knee:      ["r_knee", "bend"],
};
document.querySelectorAll("input[type=range][data-joint]").forEach(input => {
	input.addEventListener("input", () => {
		const key = input.dataset.joint;
		const [part, prop] = SLIDER_MAP[key] || [];
		if (!part) return;
		const v = parseFloat(input.value);
		try { man[part][prop] = v; } catch {}
		const label = document.querySelector(`span[data-val="${key}"]`);
		if (label) label.textContent = v.toFixed(0);
	});
});

function syncSlidersFromMannequin() {
	document.querySelectorAll("input[type=range][data-joint]").forEach(input => {
		const [part, prop] = SLIDER_MAP[input.dataset.joint] || [];
		if (!part) return;
		try {
			const v = man[part][prop] || 0;
			input.value = String(v);
			const label = document.querySelector(`span[data-val="${input.dataset.joint}"]`);
			if (label) label.textContent = Number(v).toFixed(0);
		} catch {}
	});
}

document.getElementById("print-btn").addEventListener("click", () => {
	const pose = {};
	for (const p of JOINT_NAMES) {
		const j = man[p]; if (!j) continue;
		for (const f of ["raise", "turn", "tilt", "bend", "straddle", "nod"]) {
			try {
				const v = j[f];
				if (v !== undefined && Math.abs(v) > 0.5) pose[`${p}.${f}`] = Number(v).toFixed(1);
			} catch {}
		}
	}
	const json = JSON.stringify(pose, null, 2);
	console.log("[mannequin] current posture:", pose);
	navigator.clipboard?.writeText(json).then(() => {
		const btn = document.getElementById("print-btn");
		btn.textContent = "Copied to clipboard";
		setTimeout(() => btn.textContent = "Copy posture JSON", 1500);
	});
});

// ── Direct-manipulation joint dragging ───────────────────────────
// Click a joint, drag to rotate — no gizmo, screen-space delta drives the
// joint's most natural rotation axis. Vertical drag = primary (bend/raise),
// horizontal drag = secondary (turn/straddle). Matches SetPose's UX.
//
// Per-joint mapping — each joint gets [propX, sensX, propY, sensY]:
//   propX/propY are property names on the joint object (bend, raise, turn, etc.)
//   sensX/sensY are degrees per pixel of pointer movement
// Negative sensitivity flips the drag direction so it feels natural given
// the joint's coordinate frame (e.g. arm.raise decreases when raising up).
const DRAG_MAP = {
	head:    ["turn",  0.5, "nod",     0.5],
	neck:    ["turn",  0.4, "nod",     0.4],
	torso:   ["turn",  0.4, "bend",    0.4],
	l_arm:   ["straddle",  0.4, "raise",  -0.5],
	r_arm:   ["straddle", -0.4, "raise",  -0.5],
	l_elbow: [null,    0,   "bend",    0.6],
	r_elbow: [null,    0,   "bend",    0.6],
	l_wrist: ["turn",  0.4, "bend",    0.5],
	r_wrist: ["turn",  0.4, "bend",    0.5],
	l_leg:   ["straddle",  0.3, "raise",   0.5],
	r_leg:   ["straddle", -0.3, "raise",   0.5],
	l_knee:  [null,    0,   "bend",    0.6],
	r_knee:  [null,    0,   "bend",    0.6],
	l_ankle: ["turn",  0.4, "bend",    0.5],
	r_ankle: ["turn",  0.4, "bend",    0.5],
};

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const canvas = renderer.domElement;
let dragging = null; // { key, startX, startY, startPrimary, startSecondary }

function pickJoint(clientX, clientY) {
	// Convert pointer to NDC (mannequin's canvas fills the viewport).
	const rect = canvas.getBoundingClientRect();
	pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
	pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
	raycaster.setFromCamera(pointer, camera);
	const hits = raycaster.intersectObject(man, true);
	if (!hits.length) return null;
	// Walk up the parent chain — the hit mesh is a child of a joint object
	// like man.l_elbow, man.head, etc. First ancestor that matches a known
	// joint slot wins.
	let o = hits[0].object;
	while (o) {
		for (const k of Object.keys(DRAG_MAP)) {
			if (man[k] === o) return { key: k, mesh: hits[0].object };
		}
		o = o.parent;
	}
	return null;
}

function setHoverHighlight(hit) {
	// Recolor the joint's own subtree amber. Called on hover-in / hover-out
	// and during active drag so the target reads clearly.
	const j = hit ? man[hit.key] : null;
	// Reset everyone to base color first — simpler than tracking per-joint
	// prior state, and cheap since there are ~15 joints × ~5 meshes each.
	applyUniformMaterial(man, BODY_COLOR);
	if (j) applyUniformMaterial(j, HIGHLIGHT_COLOR);
}

canvas.addEventListener("pointermove", e => {
	if (dragging) {
		const dx = e.clientX - dragging.startX;
		const dy = e.clientY - dragging.startY;
		const [propX, sensX, propY, sensY] = DRAG_MAP[dragging.key];
		try {
			if (propX && sensX) man[dragging.key][propX] = dragging.startPrimary + dx * sensX;
			if (propY && sensY) man[dragging.key][propY] = dragging.startSecondary + dy * sensY;
		} catch {}
		syncSlidersFromMannequin();
		return;
	}
	// Hover picking — light up whatever joint the cursor is over. AND freeze
	// OrbitControls while hovering, so a click-and-drag transitions smoothly
	// into posing without any camera jitter as the pointer crosses the button
	// threshold. Leaving the joint re-enables orbit for camera navigation.
	const hit = pickJoint(e.clientX, e.clientY);
	setHoverHighlight(hit);
	canvas.style.cursor = hit ? "grab" : "default";
	if (controls) controls.enabled = !hit;
});
// If the pointer leaves the canvas entirely, restore orbit so the user can
// come back into the frame without a stuck disabled state.
canvas.addEventListener("pointerleave", () => {
	if (!dragging && controls) controls.enabled = true;
});

// Capture-phase listener so we intercept the pointerdown BEFORE OrbitControls'
// internal handler sees it. When the click hits a joint, stopPropagation()
// prevents OrbitControls from ever recording the start-of-drag state, so
// there's nothing for it to update on subsequent pointermoves. When the click
// misses (empty space), we let the event through so orbit still works.
canvas.addEventListener("pointerdown", e => {
	if (e.button !== 0) return;  // only left click; middle/right stays OrbitControls
	const hit = pickJoint(e.clientX, e.clientY);
	if (!hit) return;
	e.preventDefault();
	e.stopPropagation();
	e.stopImmediatePropagation();
	// Belt + braces: also flip the controls.enabled flag so if OrbitControls
	// ever gets a stray move event it's a no-op.
	if (controls) controls.enabled = false;
	const [propX, , propY] = DRAG_MAP[hit.key];
	dragging = {
		key: hit.key,
		startX: e.clientX,
		startY: e.clientY,
		startPrimary:   propX ? (man[hit.key][propX] || 0) : 0,
		startSecondary: propY ? (man[hit.key][propY] || 0) : 0,
	};
	setHoverHighlight(hit);
	canvas.style.cursor = "grabbing";
	canvas.setPointerCapture(e.pointerId);
}, { capture: true });

const endDrag = e => {
	if (!dragging) return;
	dragging = null;
	if (controls) controls.enabled = true;
	canvas.style.cursor = "default";
	setHoverHighlight(null);
	try { canvas.releasePointerCapture(e.pointerId); } catch {}
	// Clear the "active" pose preset marker — user has moved on from any preset.
	document.querySelectorAll(".pose-btn[data-pose]").forEach(b => b.classList.remove("active"));
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// Update the status hint text so users know drag posing is a thing.
const statusEl = document.getElementById("status");
if (statusEl) statusEl.innerHTML = 'mannequin.js · <span class="pill">v5</span> · click + drag a joint to pose · orbit with right-click drag';

// No custom animation loop — mannequin.js's systemAnimate handles rendering
