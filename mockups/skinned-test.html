<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Skinned Mannequin Spike — ComfyBlockout Mockup</title>
	<style>
		:root { color-scheme: dark; }
		html, body { margin: 0; padding: 0; height: 100%; background: #14141c; color: #ddd; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
		canvas { display: block; }
		.panel {
			position: fixed; top: 12px;
			background: rgba(30, 30, 40, 0.85); backdrop-filter: blur(8px);
			border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
			padding: 12px; z-index: 10;
			max-height: calc(100vh - 24px); overflow-y: auto;
		}
		.panel.left  { left: 12px;  width: 220px; }
		.panel.right { right: 12px; width: 260px; }
		.kicker { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin: 0 0 8px; }
		.divider { height: 1px; background: rgba(255,255,255,0.06); margin: 10px 0; }
		#status {
			position: fixed; bottom: 12px; left: 12px; z-index: 10;
			font-size: 11px; color: rgba(255,255,255,0.55); pointer-events: none;
			background: rgba(30,30,40,0.7); padding: 6px 12px; border-radius: 4px;
			backdrop-filter: blur(6px);
		}
		.pill {
			display: inline-block; padding: 2px 6px; border-radius: 3px;
			background: rgba(255,180,84,0.18); color: #ffd28a;
			font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
		}
		#reset-btn {
			margin-top: 6px; width: 100%; padding: 7px 10px;
			background: rgba(255,180,84,0.22); border: 1px solid rgba(255,180,84,0.4);
			color: #ffd28a; border-radius: 5px; cursor: pointer; font: inherit; font-size: 11px;
		}
		#reset-btn:hover { background: rgba(255,180,84,0.32); }
		#bones-list {
			font-family: ui-monospace, monospace; font-size: 9px;
			color: rgba(255,255,255,0.5); max-height: 320px; overflow-y: auto;
			background: rgba(0,0,0,0.28); padding: 6px 8px; border-radius: 4px;
			border: 1px solid rgba(255,255,255,0.06);
			white-space: pre; line-height: 1.5;
		}
		#pose-json {
			width: 100%; box-sizing: border-box;
			font-family: ui-monospace, monospace; font-size: 10px;
			color: rgba(255,255,255,0.75);
			background: rgba(0,0,0,0.28); padding: 6px 8px; border-radius: 4px;
			border: 1px solid rgba(255,255,255,0.06);
			resize: vertical; min-height: 80px;
			outline: none;
		}
		#copy-btn {
			margin-top: 6px; width: 100%; padding: 7px 10px;
			background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
			color: rgba(255,255,255,0.85); border-radius: 5px; cursor: pointer; font: inherit; font-size: 11px;
		}
		#copy-btn:hover { background: rgba(255,255,255,0.1); }
		.hint {
			font-size: 10px; color: rgba(255,255,255,0.5); line-height: 1.5;
			margin-top: 6px;
		}
	</style>
</head>
<body>
<aside class="panel left">
	<h3 class="kicker">Skeleton Bones</h3>
	<div id="bones-list">Loading…</div>
</aside>

<aside class="panel right">
	<h3 class="kicker">Size</h3>
	<div style="display:flex;gap:4px;margin-bottom:10px">
		<button class="size-btn active" data-size="1.0" style="flex:1;padding:6px;background:rgba(255,180,84,0.22);border:1px solid rgba(255,180,84,0.4);color:#ffd28a;border-radius:5px;cursor:pointer;font:inherit;font-size:11px">Adult</button>
		<button class="size-btn" data-size="0.7" style="flex:1;padding:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.85);border-radius:5px;cursor:pointer;font:inherit;font-size:11px">Child</button>
	</div>
	<h3 class="kicker">Pose Interaction</h3>
	<p class="hint" style="margin:0 0 8px">Hover a limb — the bone name shows below the viewport. Left-click and drag: vertical = bend/raise, horizontal = twist/turn. Right-click still orbits.</p>
	<button id="toggle-rings-btn" type="button" style="margin-bottom:6px;width:100%;padding:7px 10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.85);border-radius:5px;cursor:pointer;font:inherit;font-size:11px">Show Rings</button>
	<button id="reset-btn" type="button">Reset Pose</button>
	<div class="divider"></div>
	<h3 class="kicker">Current Pose</h3>
	<textarea id="pose-json" readonly spellcheck="false" rows="8">{}</textarea>
	<button id="copy-btn" type="button">Copy Pose JSON</button>
</aside>

<div id="status">Xbot.glb (three.js example asset) · <span class="pill">Loading</span></div>

<script type="importmap">
{
	"imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
		"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
	}
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

function showErr(msg) {
	let el = document.getElementById("err-banner");
	if (!el) {
		el = document.createElement("div");
		el.id = "err-banner";
		el.style.cssText = "position:fixed;bottom:44px;left:12px;right:12px;padding:10px 14px;background:rgba(180,40,40,0.92);color:#fff;font-family:ui-monospace,monospace;font-size:11px;border-radius:6px;z-index:100;white-space:pre-wrap;max-width:900px;cursor:pointer";
		el.title = "Click to dismiss";
		el.addEventListener("click", () => el.remove());
		document.body.appendChild(el);
	}
	el.textContent = "ERROR: " + msg + "\n(click to dismiss)";
	console.error("[skinned-test]", msg);
}
window.addEventListener("error", e => showErr(e.message + "  @ " + (e.filename || "?") + ":" + (e.lineno || "?")));
window.addEventListener("unhandledrejection", e => showErr("unhandled: " + (e.reason?.message || e.reason || "?")));

// ── Scene setup — dark theme matching the mannequin.js mockup ──────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14141c);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 1.3, 3.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setAnimationLoop(render);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(2.5, 4, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 20;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 3;
key.shadow.camera.bottom = -1;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.HemisphereLight(0xffffff, 0x2a2a3a, 0.5);
scene.add(fill);

const ground = new THREE.Mesh(
	new THREE.PlaneGeometry(10, 10),
	new THREE.ShadowMaterial({ opacity: 0.45 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.9, 0);
orbit.enableDamping = true;
orbit.dampingFactor = 0.1;
// LEFT-drag on empty space orbits (default). LEFT-drag on a bone is
// intercepted by our capture-phase pointerdown below which calls
// stopImmediatePropagation, so OrbitControls never sees the event and
// the pose drag takes over cleanly.

// ── GLB load ───────────────────────────────────────────────────────
const MODEL_URL = "https://threejs.org/examples/models/gltf/Xbot.glb";
const statusEl = document.getElementById("status");
const bonesListEl = document.getElementById("bones-list");

let skinnedMesh = null;
let skeleton = null;
let modelRoot = null;
const bonesByName = new Map();
const initialBoneRotations = new Map();

// Darker grey than pure c4 so the mannequin doesn't read as glowing
// white on the dark bg. Roughness up for a matte-plastic finish
// (less environment reflection = calmer look).
// transparent=true is required so the shader-injected alpha drop in
// the affected region actually reaches the framebuffer as blending.
const BODY_COLOR = 0x6a6a72;
const HIGHLIGHT_COLOR = 0xffb454;
const bodyMat = new THREE.MeshStandardMaterial({
	color: BODY_COLOR, roughness: 0.9, metalness: 0.0,
	transparent: true, opacity: 1.0, depthWrite: true,
});

// Radial-gradient fade around the hovered joint's WORLD position —
// the mesh becomes see-through in a bounded sphere around whichever
// joint the user is interacting with, so the gizmo pops without
// dimming the entire limb chain that the mannequin.js-style subtree
// mask would.
const _fadeCenterUniform = { value: new THREE.Vector3() };
const _fadeActiveUniform = { value: 0.0 };
const _fadeInnerUniform  = { value: 0.02 };  // inside this radius = fully faded (small so the core is a soft dot, not a hard disk)
const _fadeOuterUniform  = { value: 0.32 };  // beyond this radius = fully opaque — wide falloff so the gradient reads as gentle mist
const _fadeAlphaUniform  = { value: 0.15 };  // target opacity at the very center of the gradient

function setupDimShader(mesh) {
	mesh.material.onBeforeCompile = (shader) => {
		shader.uniforms.fadeCenter = _fadeCenterUniform;
		shader.uniforms.fadeActive = _fadeActiveUniform;
		shader.uniforms.fadeInner  = _fadeInnerUniform;
		shader.uniforms.fadeOuter  = _fadeOuterUniform;
		shader.uniforms.fadeAlpha  = _fadeAlphaUniform;

		// VERTEX — pass post-skinning WORLD position to the fragment
		// stage so it can compute distance to the fade center. The
		// bind/inverse dance in <skinning_vertex> deposits the final
		// skinned local position in `transformed`; modelMatrix
		// promotes it to world space.
		shader.vertexShader = shader.vertexShader
			.replace("#include <common>", `#include <common>
varying vec3 vFadeWorldPos;`)
			.replace("#include <skinning_vertex>", `#include <skinning_vertex>
vFadeWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);

		// FRAGMENT — smoothstep between fadeInner and fadeOuter based
		// on world-space distance from the hovered joint. fadeActive
		// gates the effect so it's a straight no-op when nothing's
		// hovered.
		shader.fragmentShader = shader.fragmentShader
			.replace("#include <common>", `#include <common>
uniform vec3 fadeCenter;
uniform float fadeActive;
uniform float fadeInner;
uniform float fadeOuter;
uniform float fadeAlpha;
varying vec3 vFadeWorldPos;`)
			.replace("#include <colorspace_fragment>", `float _fdist = distance(vFadeWorldPos, fadeCenter);
float _fmask = (1.0 - smoothstep(fadeInner, fadeOuter, _fdist)) * fadeActive;
gl_FragColor.a *= mix(1.0, fadeAlpha, _fmask);
#include <colorspace_fragment>`);
	};
	mesh.material.needsUpdate = true;
}

// Position the fade sphere at the given bone's current world position
// and activate the gradient. Passing null deactivates.
const _fadeTmpPos = new THREE.Vector3();
function setFadeCenter(bone) {
	if (!bone) { _fadeActiveUniform.value = 0.0; return; }
	bone.getWorldPosition(_fadeTmpPos);
	_fadeCenterUniform.value.copy(_fadeTmpPos);
	_fadeActiveUniform.value = 1.0;
}

new GLTFLoader().load(MODEL_URL, (gltf) => {
	modelRoot = gltf.scene;
	modelRoot.traverse(o => {
		if (o.isMesh) {
			o.castShadow = true;
			// Xbot's default material has textures + pinkish tint. Replace
			// with a plain grey standard material — SkinnedMesh keeps its
			// skeleton binding when we swap `.material`, only the shading
			// resets.
			o.material = bodyMat;
		}
		if (o.isSkinnedMesh && !skinnedMesh) {
			skinnedMesh = o;
			skeleton = o.skeleton;
		}
	});
	if (!skeleton) {
		showErr("No SkinnedMesh found in the GLB — model isn't rigged?");
		return;
	}
	for (const b of skeleton.bones) {
		bonesByName.set(b.name, b);
		initialBoneRotations.set(b, b.rotation.clone());
	}
	bonesListEl.textContent = skeleton.bones.map(b => `• ${b.name}`).join("\n");
	console.log("[skinned-test] bones:", skeleton.bones.map(b => b.name));
	scene.add(modelRoot);
	// Now that the skeleton is loaded, wire the radial-fade shader
	// against the body material — it needs the mesh's material to
	// hook into via onBeforeCompile before first render.
	setupDimShader(skinnedMesh);
	// Spawn joint gizmos AFTER the model is in the scene so the bones'
	// world matrices are valid — buildJointGizmos parents each gizmo
	// to its bone and the render loop picks up the transforms on the
	// next frame.
	buildJointGizmos();
	statusEl.innerHTML = `Xbot.glb · <span class="pill">${skeleton.bones.length} bones</span> · hover a joint gizmo to pose`;
}, (progress) => {
	if (progress.total) {
		const pct = Math.round((progress.loaded / progress.total) * 100);
		statusEl.innerHTML = `Xbot.glb · <span class="pill">Loading ${pct}%</span>`;
	}
}, (err) => {
	showErr("GLB load failed: " + (err?.message || err));
});

// ── Drag-posing on the skinned mesh ────────────────────────────────
// Bones aren't renderable, so we can't raycast them directly. Instead,
// raycast the SkinnedMesh + read the hit face's skin-weight attribute
// to find which bone owns the vertices under the pointer. Then walk
// up the skeleton to the nearest "draggable" ancestor (arms/legs/head
// etc. — knuckles and finger joints are noise for blockout posing).
//
// Screen-space delta drives two local-axis rotations per bone:
//   axisY = vertical drag  (bend / raise / nod — the primary axis)
//   axisX = horizontal drag (twist / turn / straddle — secondary)
// Sensitivity per-joint in degrees per pixel. Negative flips direction
// so the drag feels natural for that bone's coordinate frame.
const DRAG_MAP = {
	mixamorigHead:          { axisX: "y", sensX: 0.5,  axisY: "x", sensY: 0.5 },
	mixamorigNeck:          { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.4 },
	mixamorigSpine2:        { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.4 },
	mixamorigSpine1:        { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.4 },
	mixamorigSpine:         { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.4 },
	mixamorigLeftShoulder:  { axisX: "y", sensX: 0.4,  axisY: "z", sensY: -0.5 },
	mixamorigRightShoulder: { axisX: "y", sensX: -0.4, axisY: "z", sensY: 0.5 },
	mixamorigLeftArm:       { axisX: "y", sensX: 0.4,  axisY: "z", sensY: -0.5 },
	mixamorigRightArm:      { axisX: "y", sensX: -0.4, axisY: "z", sensY: 0.5 },
	mixamorigLeftForeArm:   { axisX: null, sensX: 0,   axisY: "y", sensY: 0.6 },
	mixamorigRightForeArm:  { axisX: null, sensX: 0,   axisY: "y", sensY: -0.6 },
	mixamorigLeftHand:      { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.5 },
	mixamorigRightHand:     { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.5 },
	mixamorigLeftUpLeg:     { axisX: "y", sensX: 0.3,  axisY: "x", sensY: 0.5 },
	mixamorigRightUpLeg:    { axisX: "y", sensX: -0.3, axisY: "x", sensY: 0.5 },
	mixamorigLeftLeg:       { axisX: null, sensX: 0,   axisY: "x", sensY: 0.6 },
	mixamorigRightLeg:      { axisX: null, sensX: 0,   axisY: "x", sensY: 0.6 },
	mixamorigLeftFoot:      { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.5 },
	mixamorigRightFoot:     { axisX: "y", sensX: 0.4,  axisY: "x", sensY: 0.5 },
};

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const canvas = renderer.domElement;
let hoveredBone = null;
let dragState = null;

// Per-joint gizmo — a TransformControls-lite widget parented (in
// world-space, updated per frame) to each bone. Inside each:
//   - centerSphere: white ball at the joint. Draggable on ROOT to
//                   translate the whole model in the ground plane.
//   - rings:        one torus per rotation axis defined in DRAG_MAP,
//                   color-coded (X red, Y green, Z blue) and oriented
//                   so its plane is perpendicular to that local axis.
//                   Click-drag a ring → rotate the bone around that
//                   axis independently of the others.
const jointGizmos = new Map(); // bone → { group, centerSphere, rings: [{ mesh, axis, sensitivity }] }

const RING_RADIUS = 0.11;
const RING_SEGMENTS = 72;
const CENTER_RADIUS = 0.016;
const AXIS_COLORS = { x: 0xff5555, y: 0x66dd66, z: 0x5599ff };

// Bump the raycaster's line hit tolerance so pixel-thin ring lines
// still have a comfortable clickable footprint in world units. 4cm
// of grab slop reads as "the ring is stuck to my cursor as long as
// I'm nearby" without triggering unrelated overlaps.
raycaster.params.Line.threshold = 0.04;

// LineLoop rings render as native ~1px browser lines — no thickness
// controls needed, and they stay pixel-thin regardless of camera zoom.
// Each ring's plane is set by rotating the base XY circle so its
// normal aligns with the bone's local axis-of-rotation.
function makeRing(axis, colorHex, sensitivity, bone) {
	const pts = [];
	for (let i = 0; i <= RING_SEGMENTS; i++) {
		const a = (i / RING_SEGMENTS) * Math.PI * 2;
		pts.push(new THREE.Vector3(Math.cos(a) * RING_RADIUS, Math.sin(a) * RING_RADIUS, 0));
	}
	const geom = new THREE.BufferGeometry().setFromPoints(pts);
	const mat = new THREE.LineBasicMaterial({
		color: colorHex, transparent: true, opacity: 0.4,
		depthTest: false, depthWrite: false,
	});
	const line = new THREE.LineLoop(geom, mat);
	line.renderOrder = 998;
	// Base circle lies in the XY plane (normal along Z). Rotate so
	// its normal aligns with the axis it represents:
	//   x-axis rotation → ring in YZ plane → rotate 90° about Y
	//   y-axis rotation → ring in XZ plane → rotate 90° about X
	//   z-axis rotation → ring in XY plane → no rotation needed
	if (axis === "x") line.rotation.y = Math.PI / 2;
	else if (axis === "y") line.rotation.x = Math.PI / 2;
	line.userData.role = "rotate";
	line.userData.axis = axis;
	line.userData.sensitivity = sensitivity;
	line.userData.bone = bone;
	line.userData.baseColor = colorHex;
	return line;
}

function makeCenterSphere(bone) {
	const geom = new THREE.SphereGeometry(CENTER_RADIUS, 14, 10);
	const mat = new THREE.MeshBasicMaterial({
		color: 0xffffff, transparent: true, opacity: 0.7,
		depthTest: false, depthWrite: false,
	});
	const mesh = new THREE.Mesh(geom, mat);
	mesh.renderOrder = 999;
	// Center handle drags the joint in the DRAG_MAP screen-delta way —
	// horizontal drag rotates one axis, vertical rotates the other. The
	// rings are for fine-tuning a single axis; the center is the fast
	// two-axis "grab and pose" handle.
	mesh.userData.role = "rotate-free";
	mesh.userData.bone = bone;
	mesh.userData.baseColor = 0xffffff;
	return mesh;
}

function buildJointGizmos() {
	let built = 0, missing = [];
	for (const name of Object.keys(DRAG_MAP)) {
		const bone = bonesByName.get(name);
		if (!bone) { missing.push(name); continue; }
		const map = DRAG_MAP[name];
		const group = new THREE.Group();
		group.userData.bone = bone;
		// Groups always render — the center dot is the persistent click
		// target ("select the joint circle to grab"). Ring visibility
		// is controlled separately via _ringsHidden.

		const centerSphere = makeCenterSphere(bone);
		group.add(centerSphere);

		const rings = [];
		const addRing = (axis, color, sens) => {
			const r = makeRing(axis, color, sens, bone);
			// Match the global rings-hidden default — free-move is the
			// primary interaction; rings are opt-in fine-tuning.
			r.visible = !_ringsHidden;
			group.add(r);
			rings.push({ mesh: r, axis, sensitivity: sens });
		};
		if (map.axisY) addRing(map.axisY, AXIS_COLORS[map.axisY], map.sensY);
		if (map.axisX) addRing(map.axisX, AXIS_COLORS[map.axisX], map.sensX);
		// Add a third ring for ball-joint-ish bones (both DRAG_MAP axes
		// defined). Hinge joints (elbows/knees) stay at their single
		// bend axis — a twist ring on an elbow just invites breaking
		// the skeleton with no anatomical payoff.
		if (map.axisX && map.axisY) {
			const used = new Set([map.axisX, map.axisY]);
			const third = ["x", "y", "z"].find(a => !used.has(a));
			if (third) addRing(third, AXIS_COLORS[third], 0.4);
		}

		scene.add(group);
		jointGizmos.set(bone, { group, centerSphere, rings });
		built++;
	}
	console.log(`[skinned-test] built ${built}/${Object.keys(DRAG_MAP).length} joint gizmos`, missing.length ? `missing: ${missing.join(", ")}` : "");
}



// Called every frame — snap each gizmo group to its bone's world
// transform, ignoring bone scale so gizmos stay at consistent world
// size regardless of any Mixamo-style root scale factor.
const _gizmoTmpPos = new THREE.Vector3();
const _gizmoTmpQuat = new THREE.Quaternion();
const _gizmoTmpScale = new THREE.Vector3();
function updateGizmoTransforms() {
	for (const [bone, g] of jointGizmos) {
		bone.matrixWorld.decompose(_gizmoTmpPos, _gizmoTmpQuat, _gizmoTmpScale);
		g.group.position.copy(_gizmoTmpPos);
		g.group.quaternion.copy(_gizmoTmpQuat);
	}
}

// Opacities per piece state — kept as constants so the state setter
// has a single source of truth. Non-emphasized pieces are deliberately
// low-key so the emphasized (mouseover-target) piece pops by contrast.
const REST_OPACITY_RING = 0.18;
const REST_OPACITY_CENTER = 0.35;
const HOVER_OPACITY_OTHERS = 0.32;   // opacity of the pieces you're NOT on during hover
const DRAG_OPACITY_OTHERS = 0.22;    // ditto during drag

// Whole-gizmo visual state with per-piece emphasis. Hover / drag
// reveal all pieces of one joint's gizmo together (so the widget
// reads as one unit), and the specifically-hovered piece brightens
// into the app's amber highlight so the user can tell which handle
// their cursor is actually on.
function setGizmoState(bone, state, emphasizedPiece) {
	const g = jointGizmos.get(bone);
	if (!g) return;
	const pieces = [g.centerSphere, ...g.rings.map(r => r.mesh)];
	for (const p of pieces) {
		const m = p.material;
		const isRing = p.userData.role === "rotate";
		const isEmphasized = p === emphasizedPiece;
		if (state === "drag") {
			if (isEmphasized) {
				m.color.setHex(HIGHLIGHT_COLOR);
				m.opacity = 1.0;
			} else {
				m.color.setHex(p.userData.baseColor);
				m.opacity = DRAG_OPACITY_OTHERS;
			}
		} else if (state === "hover") {
			if (isEmphasized) {
				m.color.setHex(HIGHLIGHT_COLOR);
				m.opacity = 1.0;
			} else {
				m.color.setHex(p.userData.baseColor);
				m.opacity = HOVER_OPACITY_OTHERS;
			}
		} else {
			m.color.setHex(p.userData.baseColor);
			m.opacity = isRing ? REST_OPACITY_RING : REST_OPACITY_CENTER;
		}
	}
}

// Raycast against every gizmo piece (rings + centers) AND every IK
// controller sphere. Returns the hit Mesh whose userData carries
// role + chain/bone info so the drag handler dispatches correctly.
function pickGizmoPiece(clientX, clientY) {
	if (!jointGizmos.size) return null;
	const rect = canvas.getBoundingClientRect();
	pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
	pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
	raycaster.setFromCamera(pointer, camera);
	const targets = [];
	for (const g of jointGizmos.values()) {
		targets.push(g.centerSphere);
		for (const r of g.rings) targets.push(r.mesh);
	}
	const hits = raycaster.intersectObjects(targets, false);
	return hits.length ? hits[0].object : null;
}

let hoveredPiece = null;

canvas.addEventListener("pointermove", (e) => {
	if (dragState) {
		if (dragState.role === "rotate") {
			// Ring drag — single-axis fine-tune. Horizontal drag × sens
			// gives degrees, applied off the drag-start snapshot so the
			// motion feels continuous across multiple drags.
			const dx = e.clientX - dragState.startX;
			const rad = (dragState.startDeg + dx * dragState.sensitivity) * Math.PI / 180;
			const rest = initialBoneRotations.get(dragState.bone);
			dragState.bone.rotation[dragState.axis] = rest[dragState.axis] + rad;
		} else if (dragState.role === "rotate-free") {
			// Center drag — screen-space delta rotates BOTH DRAG_MAP
			// axes at once (horizontal → secondary, vertical → primary),
			// matching the pre-gizmo drag-posing feel.
			const dx = e.clientX - dragState.startX;
			const dy = e.clientY - dragState.startY;
			const map = dragState.map;
			const rest = initialBoneRotations.get(dragState.bone);
			if (map.axisX && map.sensX) {
				const rad = (dragState.startSecondary + dx * map.sensX) * Math.PI / 180;
				dragState.bone.rotation[map.axisX] = rest[map.axisX] + rad;
			}
			if (map.axisY && map.sensY) {
				const rad = (dragState.startPrimary + dy * map.sensY) * Math.PI / 180;
				dragState.bone.rotation[map.axisY] = rest[map.axisY] + rad;
			}
		}
		return;
	}
	// Two-pass hover picker: first check the currently-visible gizmo's
	// pieces (rings + center); if none, fall back to raycasting the
	// mesh + skin-weight bone lookup so hovering anywhere on the arm
	// reveals the arm gizmo without needing to hit an invisible dot.
	let piece = pickGizmoPiece(e.clientX, e.clientY);
	let newBone = piece ? piece.userData.bone : null;

	if (hoveredBone && hoveredBone !== newBone) {
		setGizmoState(hoveredBone, "rest");
	}
	if (newBone) {
		// Pass the specific piece so its hover emphasis (amber tint,
		// full opacity) reads on the exact ring/center the cursor is
		// on, not the whole widget uniformly.
		setGizmoState(newBone, "hover", piece);
	}
	hoveredPiece = piece;
	hoveredBone = newBone;
	setFadeCenter(hoveredBone);
	canvas.style.cursor = newBone ? "grab" : "";
	if (piece && statusEl) {
		const name = piece.userData.bone.name.replace(/^mixamorig/, "");
		const label = piece.userData.role === "rotate"
			? `${name} · rotate ${piece.userData.axis.toUpperCase()}`
			: `${name} · free rotate`;
		statusEl.innerHTML = `Xbot.glb · <span class="pill">${label}</span>`;
	} else if (newBone && statusEl) {
		statusEl.innerHTML = `Xbot.glb · <span class="pill">${newBone.name.replace(/^mixamorig/, "")}</span>`;
	} else if (skeleton && statusEl) {
		statusEl.innerHTML = `Xbot.glb · <span class="pill">${skeleton.bones.length} bones</span> · hover a limb to pose`;
	}
});

canvas.addEventListener("pointerdown", (e) => {
	if (e.button !== 0) return;
	// Only gizmo pieces (or IK controller spheres) can start a drag —
	// clicking the raw mesh just reveals a gizmo, no drag.
	const piece = pickGizmoPiece(e.clientX, e.clientY);
	if (!piece) return;
	e.preventDefault();
	e.stopPropagation();
	e.stopImmediatePropagation();
	const bone = piece.userData.bone;
	if (piece.userData.role === "rotate") {
		const axis = piece.userData.axis;
		const rest = initialBoneRotations.get(bone);
		const currentDeg = (bone.rotation[axis] - rest[axis]) * 180 / Math.PI;
		dragState = {
			role: "rotate",
			bone,
			piece,
			axis,
			sensitivity: piece.userData.sensitivity,
			startX: e.clientX,
			startY: e.clientY,
			startDeg: currentDeg,
		};
	} else if (piece.userData.role === "rotate-free") {
		const map = DRAG_MAP[bone.name];
		const rest = initialBoneRotations.get(bone);
		const startSecondary = map.axisX ? (bone.rotation[map.axisX] - rest[map.axisX]) * 180 / Math.PI : 0;
		const startPrimary   = map.axisY ? (bone.rotation[map.axisY] - rest[map.axisY]) * 180 / Math.PI : 0;
		dragState = {
			role: "rotate-free",
			bone,
			piece,
			map,
			startX: e.clientX,
			startY: e.clientY,
			startPrimary,
			startSecondary,
		};
	} else {
		return;
	}
	canvas.style.cursor = "grabbing";
	setGizmoState(bone, "drag", piece);
	canvas.setPointerCapture(e.pointerId);
}, { capture: true });

const endDrag = (e) => {
	if (!dragState) return;
	const draggedBone = dragState.bone;
	dragState = null;
	canvas.style.cursor = hoveredBone ? "grab" : "";
	setGizmoState(draggedBone, hoveredBone === draggedBone ? "hover" : "rest");
	setFadeCenter(hoveredBone);
	try { canvas.releasePointerCapture(e.pointerId); } catch {}
	renderPoseJson();
};
canvas.addEventListener("pointerup", endDrag, { capture: true });
canvas.addEventListener("pointercancel", endDrag, { capture: true });

// ── Pose readout ───────────────────────────────────────────────────
// Same JSON format as the mannequin.js version — flat map of
// "bone.axis": degrees. Only shows non-trivial rotations (> 0.5°).
function renderPoseJson() {
	if (!skeleton) return;
	const out = {};
	for (const name of Object.keys(DRAG_MAP)) {
		const b = bonesByName.get(name);
		if (!b) continue;
		const rest = initialBoneRotations.get(b);
		for (const axis of ["x", "y", "z"]) {
			const deg = (b.rotation[axis] - rest[axis]) * 180 / Math.PI;
			if (Math.abs(deg) > 0.5) out[`${name.replace(/^mixamorig/, "")}.${axis}`] = Number(deg.toFixed(1));
		}
	}
	const ta = document.getElementById("pose-json");
	if (ta) ta.value = JSON.stringify(out, null, 2);
}

document.getElementById("reset-btn").addEventListener("click", () => {
	for (const [bone, rest] of initialBoneRotations) bone.rotation.copy(rest);
	renderPoseJson();
});

// Toggle ring visibility across every gizmo — useful when you just
// want to grab the center dot for free-drag posing without the ring
// overlay competing for the click. Rings hide by setting each ring
// mesh.visible = false; three's raycaster skips invisible objects, so
// picks fall through to the center sphere naturally.
let _ringsHidden = true;
const toggleRingsBtn = document.getElementById("toggle-rings-btn");
toggleRingsBtn?.addEventListener("click", () => {
	_ringsHidden = !_ringsHidden;
	for (const g of jointGizmos.values()) {
		for (const r of g.rings) r.mesh.visible = !_ringsHidden;
	}
	toggleRingsBtn.textContent = _ringsHidden ? "Show Rings" : "Hide Rings";
});

// Uniform-scale size toggle. Xbot's default is roughly 1.72m tall, so
// 0.7× ≈ 1.2m — 6-year-old-ish. Not anatomically child-like proportions
// (head:body ratio stays adult), just smaller. If we want real kid
// proportions we'd need to source a second GLB with a shorter torso +
// larger relative head.
document.querySelectorAll(".size-btn").forEach(btn => {
	btn.addEventListener("click", () => {
		const s = parseFloat(btn.dataset.size);
		if (modelRoot) modelRoot.scale.setScalar(s);
		document.querySelectorAll(".size-btn").forEach(b => {
			const isActive = b === btn;
			b.style.background = isActive ? "rgba(255,180,84,0.22)" : "rgba(255,255,255,0.05)";
			b.style.borderColor = isActive ? "rgba(255,180,84,0.4)" : "rgba(255,255,255,0.1)";
			b.style.color = isActive ? "#ffd28a" : "rgba(255,255,255,0.85)";
		});
	});
});

document.getElementById("copy-btn").addEventListener("click", async () => {
	const ta = document.getElementById("pose-json");
	if (!ta) return;
	try {
		await navigator.clipboard.writeText(ta.value);
		const btn = document.getElementById("copy-btn");
		const orig = btn.textContent;
		btn.textContent = "Copied";
		setTimeout(() => { btn.textContent = orig; }, 1200);
	} catch {
		ta.focus(); ta.select();
	}
});

// ── Render / resize ────────────────────────────────────────────────
function render() {
	orbit.update();
	updateGizmoTransforms();
	// Keep the radial fade centered on the active joint as it moves —
	// a bone's world position changes when any parent rotates, so a
	// once-per-hover snapshot would drift off during drag posing.
	if (hoveredBone) setFadeCenter(hoveredBone);
	renderer.render(scene, camera);
}
addEventListener("resize", () => {
	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
